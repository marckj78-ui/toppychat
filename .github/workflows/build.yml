name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android project if missing
        working-directory: mobile-app
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.marco.toppychat --project-name toppychat
          fi

      - name: Apply custom AndroidManifest
        working-directory: mobile-app
        run: cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Build APK
        working-directory: mobile-app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toppychat-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
